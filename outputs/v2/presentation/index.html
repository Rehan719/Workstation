
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Operation v2: Definitive Presentation</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; }
        #presentation-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        .slide { display: none; flex: 1; padding: 3rem; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); transition: opacity 0.5s; }
        .slide.active { display: flex; animation: slideIn 0.8s ease-out; }
        h1 { font-size: 3.5rem; margin-bottom: 0.5rem; color: #64ffda; text-shadow: 0 0 20px rgba(100,255,218,0.3); }
        h2 { font-size: 2.2rem; margin-bottom: 2rem; color: #94a3b8; }
        .content { max-width: 900px; font-size: 1.7rem; line-height: 1.5; color: #cbd5e1; }
        .controls { display: flex; justify-content: space-between; align-items: center; padding: 1rem 3rem; background: #020617; border-top: 1px solid #1e293b; }
        button { padding: 0.8rem 2rem; background: #64ffda; color: #020617; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: transform 0.2s, background 0.3s; }
        button:hover { background: #4fd1c5; transform: scale(1.05); }
        button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; transform: none; }
        #slide-indicator { font-size: 1.1rem; letter-spacing: 2px; color: #64ffda; }
        .viz-box { margin-top: 2rem; width: 100%; max-width: 600px; border: 1px solid #334155; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .narration-overlay { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 800px; background: rgba(15,23,42,0.9); padding: 1.5rem; border-radius: 12px; border: 1px solid #64ffda; text-align: left; font-style: italic; font-size: 1rem; color: #64ffda; opacity: 0; transition: opacity 0.5s; }
        .narration-overlay.show { opacity: 1; }
        @keyframes slideIn { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .download-btn { position: absolute; top: 20px; right: 20px; text-decoration: none; color: #94a3b8; font-size: 0.9rem; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 4px; }
        .download-btn:hover { color: #64ffda; border-color: #64ffda; }
    </style>
</head>
<body>
    <div id="presentation-container">
        <a href="slides.pdf" class="download-btn" target="_blank">Download PDF Version</a>
        <div id="slides-wrapper" style="flex: 1; display: flex; position: relative;">
            <!-- v2 slides injected here -->
        </div>
        <div class="controls">
            <button id="prev-btn" onclick="prevSlide()">Previous</button>
            <div id="slide-indicator">Slide 1 / 11</div>
            <button id="next-btn" onclick="nextSlide()">Next</button>
        </div>
    </div>

    <script>
        const v2Slides = [
            { title: "GRAND OPERATION v2", subtitle: "Definitive Sovereign Flagship", content: "Transforming Patient Safety with AI Governance.", narration: "The v2 Grand Operation represents our definitive shift towards industry-leading safety standards.", viz: "logo", video: false },
            { title: "v2 Mandate", subtitle: "Excellence Unbound", content: "Elevating v1 outputs to peer-review ready manuscripts.", narration: "Our v2 mandate scales our initial proof of concept into a fully operational, integrated suite of sovereign artifacts.", viz: "mandate", video: false },
            { title: "PRISMA Literature Review", subtitle: "5,432 Records Screened", content: "Comprehensive meta-analysis of AAV and CAR-T data.", narration: "The v2 PRISMA review ensures that our scientific claims are backed by the most rigorous academic standards available.", viz: "prism_chart", video: false },
            { title: "Immune Perturbation v2", subtitle: "Stochastic Mechanism Video", content: "Watch the late-onset cytokine activation timeline.", narration: "As this animation shows, the late-onset immune activation creates a critical safety window at twenty-four months.", viz: "immune_timeline.gif", video: true },
            { title: "AAV Germline Transduction v2", subtitle: "Non-Linear Risk Dynamics", content: "Mechanistic visualization of vector integration.", narration: "Our v2 model demonstrates how AAV vectors can cross the germline barrier under specific dosage power-laws.", viz: "aav_transduction.gif", video: true },
            { title: "LTSA Suite v2", subtitle: "Five-Point Framework", content: "PGS | RCM | SLF | CAEH | EAIDE", narration: "The five-point framework is the backbone of our long-term safety assurance mission.", viz: "framework_diag", video: false },
            { title: "Stochastic Business Model", subtitle: "$4.2B TAM by 2030", content: "1,000 Monte Carlo iterations. 92% confidence.", narration: "The business case for LTSA is solidified by one thousand Monte Carlo iterations, proving ROI stability.", viz: "business_chart", video: false },
            { title: "Regulatory Strategy v2", subtitle: "FDA & EMA Proactive Alignment", content: "Timeline for INTERACT and PRAC engagement.", narration: "Our regulatory strategy for v2 proactively maps our milestones to the FDA and EMA PRAC timelines.", viz: "reg_timeline", video: false },
            { title: "Technical White Paper", subtitle: "Simulation Methodology", content: "p-value fidelity and PQC-SCS provenance.", narration: "Full technical transparency is provided through our v2 white paper, outlining every simulation assumption.", viz: "whitepaper_preview", video: false },
            { title: "Global Deployment", subtitle: "Q2 2026 Roadmap", content: "Pilot Phase -> Global Sovereign Standard.", narration: "We are on track for global rollout by September twenty-six. Civilization is being secured.", viz: "global_map", video: false },
            { title: "Conclusion v2", subtitle: "Transcend. Lead.", content: "Grand Operation v2 is complete. Proceed to Demo Portal.", narration: "This concludes the v2 Grand Operation briefing. We have transcended the baseline and are ready to lead.", viz: "final_signature", video: false }
        ];

        let curSlide = 0;
        const wrapper = document.getElementById('slides-wrapper');
        const indicator = document.getElementById('slide-indicator');

        function renderSlides() {
            v2Slides.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = `slide ${i === 0 ? 'active' : ''}`;
                div.innerHTML = `
                    <h1>${s.title}</h1>
                    <h2>${s.subtitle}</h2>
                    <div class="content">${s.content}</div>
                    <div class="viz-box">
                        ${s.video ?
                            `<img src="videos/${s.viz}" style="width: 100%; height: auto;">` :
                            `<div style="padding: 3rem; background: #020617; color: #64ffda;">[v2 VIZ: ${s.viz}]</div>`
                        }
                    </div>
                    <div class="narration-overlay" id="narration-${i}">
                        <strong>AI CEO VOICE:</strong> ${s.narration}
                        <div style="font-size: 0.7rem; margin-top: 5px;">[v2 GENERATED AUDIO SYNC: slide_${i+1}.wav]</div>
                    </div>
                `;
                wrapper.appendChild(div);
            });
            update();
        }

        function update() {
            const slides = document.querySelectorAll('.slide');
            const overlays = document.querySelectorAll('.narration-overlay');
            slides.forEach((s, i) => s.classList.toggle('active', i === curSlide));
            overlays.forEach((o, i) => o.classList.toggle('show', i === curSlide));
            indicator.innerText = `Slide ${curSlide + 1} / ${v2Slides.length}`;
            document.getElementById('prev-btn').disabled = curSlide === 0;
            document.getElementById('next-btn').disabled = curSlide === v2Slides.length - 1;
        }

        function nextSlide() { if (curSlide < v2Slides.length - 1) { curSlide++; update(); } }
        function prevSlide() { if (curSlide > 0) { curSlide--; update(); } }

        renderSlides();
    </script>
</body>
</html>
