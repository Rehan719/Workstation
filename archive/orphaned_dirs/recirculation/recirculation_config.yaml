engine:
  cycle_target_ms: 60000
  confidence_threshold: 0.85
  hallucination_suppression: true
  fractal_scaling:
    enabled: true
    max_recursion_depth: 7
    micro_cycle_ms: 1000
    meso_cycle_ms: 10000
    macro_cycle_ms: 60000
  neural_circuit_breaker:
    enabled: true
    hallucination_threshold: 0.005
    divergence_threshold: 0.10
  nemo_config: "edge_optimised"
  nematron_enabled: true
stages:
  sense:
    timeout_ms: 180000
    fallback: "cached_vector_index"
  analyze:
    timeout_ms: 240000
    fallback: "route_to_human_review"
  act:
    timeout_ms: 300000
    fallback: "low_fidelity_sim"
  learn:
    timeout_ms: 120000
    fallback: "snapshot_rollback"
  recirculate:
    timeout_ms: 60000
    fallback: "differential_patch"
telemetry:
  enabled: true
  ueg_integration: true
  metrics:
    - fractal_recirculation_velocity
    - neural_sophistication_index
    - truth_alignment_score
    - viral_coefficient
    - cataclysmic_shift_rate
    - neural_pathway_optimisation_gain
    - unit_cost_reduction
    - ceo_confidence_score
