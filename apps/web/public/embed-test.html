<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workstation Embed Test | v151.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .embed-container { width: 400px; padding: 32px; border-radius: 24px; background: #020617; border: 1px solid rgba(100, 255, 218, 0.2); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .aura-text { color: #64ffda; text-shadow: 0 0 10px rgba(100, 255, 218, 0.3); }
    </style>
</head>
<body>
    <div class="embed-container text-center space-y-6">
        <div class="flex items-center justify-center gap-2 mb-4">
            <div class="w-2 h-2 bg-[#64ffda] rounded-full animate-pulse"></div>
            <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">Sovereign Widget</span>
        </div>

        <h2 class="text-xl font-black">Neural-Nexus-v2</h2>
        <p class="text-xs text-slate-400 font-bold leading-relaxed">This tool is licensed from the Workstation Marketplace and is currently running via the Public API Gateway.</p>

        <div class="p-6 bg-slate-900/50 rounded-2xl border border-white/5 space-y-2">
            <p class="text-[10px] font-black text-slate-500 uppercase">Live Efficiency</p>
            <p class="text-3xl font-black aura-text">94.2%</p>
        </div>

        <button class="w-full py-3 bg-[#64ffda] text-[#020617] font-black rounded-xl text-xs uppercase tracking-widest hover:scale-105 transition-all">
            Refresh Synthesis
        </button>

        <div class="pt-4 border-t border-white/5">
            <p class="text-[9px] text-slate-600 font-bold uppercase">Powered by Workstation v151.0</p>
        </div>
    </div>
</body>
</html>
