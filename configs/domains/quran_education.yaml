# Quran Education Platform v8.0 Configuration
# Domain: RELIGION (DOM-REL-001)
# Subdomain: QURAN_EDUCATION

platform:
  name: "Quran Education Platform"
  product_id: "VSB-SIG-QEP-8.1"
  version: "8.1.0"
  domain: "RELIGION"
  subdomain: "QURAN_EDUCATION"
  realms:
    - forge
    - genome
    - learner
    - developer
    - scholar
    - enterprise

curriculum:
  levels: 10
  lessons_per_level: 50
  subjects:
    - Tajweed
    - Hifz
    - Tafsir
    - Arabic
  samples:
    - level: 1
      name: "Al-Fatihah"
    - level: 5
      name: "Intermediate Tajweed"
    - level: 10
      name: "Advanced Tafsir"

governance:
  scholar_board:
    min_scholars: 5
    review_cycle: quarterly
  safeguarding:
    compliance_standard: "Safeguarding Act"
    audit_frequency: quarterly
  accessibility:
    standard: "WCAG 2.1 AA"

technical:
  lms:
    type: "Custom/Moodle"
    api_version: "v1"
  auth:
    method: "JWT + VSB"
  database:
    type: "PostgreSQL"

achievements:
  student_tiers: 6
  teacher_tiers: 5
  tracking_enabled: true

archive:
  retention_policy:
    curriculum: 90_days
    policies: 7_years
    student_records: permanent
  rerun_limit: 3
