# Workstation IDBO — local/self-hosted run. COST-FREE by default: in-house-first AI (no external key),
# file-based persistence (no managed DB), no paid services. `docker compose up` and open :8000.
# Paid options (managed Postgres, external AI keys) are documented + commented — enable them ONLY on
# your own accounts. See docs/DEPLOYMENT.md.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - AI_ALLOW_EXTERNAL=false          # in-house-first; native floor always serves, $0
      - DATA_DIR=/app/data
      # - OLLAMA_URL=http://host.docker.internal:11434/api/generate  # optional self-hosted local model ($0)
      # - ANTHROPIC_API_KEY=...   # OPTIONAL external accelerant — per-token cost; only with AI_ALLOW_EXTERNAL=true
    volumes:
      - workstation_data:/app/data       # persistent data across restarts (local volume, $0)
    restart: unless-stopped

  # ── OPTIONAL: Postgres (INCURS COST when hosted; the app uses file persistence by default and does
  #    NOT require this). Uncomment + wire DATABASE_URL only if/when you choose to.
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     - POSTGRES_USER=workstation
  #     - POSTGRES_PASSWORD=change-me-before-use
  #     - POSTGRES_DB=workstation
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  workstation_data:
  # pgdata:
