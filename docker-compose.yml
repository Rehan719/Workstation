# Workstation IDBO — local/self-hosted run. COST-FREE by default: in-house-first AI (no external key),
# file-based persistence (no managed DB), no paid services. `docker compose up` and open :8000.
# The paid option (an external AI key) is documented + commented — enable it ONLY on your own account.
# A database is not an option today (see below). See docs/DEPLOYMENT.md.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - AI_ALLOW_EXTERNAL=false          # in-house-first; native floor always serves, $0
      - DATA_DIR=/app/data
      # - OLLAMA_URL=http://host.docker.internal:11434/api/generate  # optional self-hosted local model ($0)
      # - ANTHROPIC_API_KEY=...   # OPTIONAL external accelerant — per-token cost; only with AI_ALLOW_EXTERNAL=true
    volumes:
      - workstation_data:/app/data       # persistent data across restarts (local volume, $0)
    restart: unless-stopped

  # ── NOT AN OPTION TODAY: Postgres. The Owner deferred a database (plan item P4.4) on 2026-10-12 until a
  #    measured need exists. The app keeps its records in files and reads no DATABASE_URL, so a database
  #    started here would hold nothing. The service is kept, commented, as the shape a later round would
  #    start from (W1147).
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     - POSTGRES_USER=workstation
  #     - POSTGRES_PASSWORD=change-me-before-use
  #     - POSTGRES_DB=workstation
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  workstation_data:
  # pgdata:
