[tool.poetry]
name = "workstation"
version = "1.0.0"
packages = [
    { include = "agentic_core" },
]
description = "Workstation — AI-Mediated Workspace, Commercial MVP."
authors = ["Rehan719"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
langchain = "^0.2.0"
langchain-community = "^0.2.0"
autogen = "^0.9.10"
pydantic = "^2.12.5"
pyyaml = "^6.0.3"
fastapi = "^0.129.0"
uvicorn = "^0.41.0"
streamlit = "^1.54.0"
redis = "^7.2.0"
sqlmodel = "^0.0.22"
sqlalchemy = "^2.0.30"
chromadb = "^1.5.5"
prefect = "^2.19.0"
psutil = "^7.2.2"
anthropic = ">=0.109.0"
openai = "^1.30.1"
transformers = "^4.41.0"
torch = "^2.11.0"
numpy = ">=1.26.4"
shap = ">=0.45.0,<0.46.0"
PyJWT = ">=2.10.0"
pandas = "^2.3.3"
matplotlib = "^3.9.0"
seaborn = "^0.13.2"
plotly = "^5.22.0"
scipy = "^1.13.0"
scikit-learn = "^1.5.0"
networkx = "3.5"
pyro-ppl = "^1.9.1"
ray = "^2.12.0"
celery = "^5.6.3"
web3 = "^6.19.0"
# Required for Triad/Verification
z3-solver = "^4.13.0.0"
sympy = "^1.12"
qiskit = "^1.1.0"
pennylane = "^0.36.0"
camel-tools = "^1.5.2"
cryptography = "^42.0.0"
oqs = "^0.10.2"
psycopg2-binary = "^2.9.11"
mesa = "3.0.1"
firebase-admin = "^7.3.0"
# W906 (FU-607) - imported or loaded by live code and installed by requirements.txt, but never declared here, so the
# lock held none of them and requirements.txt carried them by hand. fpdf2 and pypdf are held at the versions CI
# installs: their newer releases (2.9.0 and 6.21.4 when this was locked) are a change of their own
fpdf2 = "2.8.7"
openpyxl = "^3.1.5"
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
pypdf = "6.19.0"
python-docx = "^1.2.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
python-multipart = "^0.0.22"
python-pptx = "^1.0.2"
torchsde = "^0.2.6"
# Payment rails are OPTIONAL and deliberately NOT declared here: a LIVE Stripe key is present in .env, so activating
# real charges requires three deliberate steps - `pip install stripe`, plus STRIPE_LIVE_ENABLED=true, plus a live
# key. See agentic_core/api/v310/payments.py. (Moved here from requirements.txt by W906: that file is exported from
# poetry.lock, and an export carries no comment.)

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"
pytest-asyncio = "^0.23.7"
ruff = "^0.4.4"
mypy = "^1.10.0"
black = "^24.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
