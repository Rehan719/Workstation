[tool.poetry]
name = "workstation"
version = "1.0.0"
packages = [
    { include = "agentic_core" },
    { include = "src" },
]
description = "Workstation — AI-Mediated Workspace, Commercial MVP."
authors = ["Rehan719"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
autogen = "^0.9.10"
pydantic = "^2.12.5"
pyyaml = "^6.0.3"
fastapi = "^0.129.0"
uvicorn = "^0.41.0"
streamlit = "^1.54.0"
sqlmodel = "^0.0.22"
sqlalchemy = "^2.0.30"
chromadb = "^1.5.5"
psutil = "^7.2.2"
anthropic = ">=0.109.0"
openai = "^1.30.1"
torch = "^2.11.0"
numpy = ">=1.26.4"
pandas = "^2.3.3"
matplotlib = "^3.9.0"
plotly = "^5.22.0"
scipy = "^1.13.0"
networkx = "3.5"
# Required for Triad/Verification
camel-tools = "^1.5.2"
cryptography = "^42.0.0"
POT = "^0.9.3"
psycopg2-binary = "^2.9.11"
mesa = "3.0.1"
# W628 (FU-283) - imported or loaded by live code, previously present only by transitive luck or a hand edit
fpdf2 = "^2.8.7"
openpyxl = "^3.1.5"
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
python-docx = "^1.2.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
python-pptx = "^1.0.2"
python-multipart = "^0.0.22"
pypdf = "^6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"
pytest-asyncio = "^0.23.7"
ruff = "^0.4.4"
mypy = "^1.10.0"
black = "^24.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
