name: Publish Signature Product Suite v8.0

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - constitutional-core
          - core-business-intelligence
          - core-science-intelligence
          - core-scholarship-intelligence
          - core-domain-specific

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - name: Build package
        run: |
          cd products/signature-product-suite/packages/${{ github.event.inputs.package }}
          pip install build twine
          python -m build
      - name: Publish to GitHub Packages
        run: |
          twine upload --repository-url https://npm.pkg.github.com/@Rehan719 \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            products/signature-product-suite/packages/${{ github.event.inputs.package }}/dist/*
