[project]
name = "mjm-intelligence-engine"
version = "1.0.0"
description = "Mushahida-Jaiza-Muaina (MJM) Intelligence Engine - A Signature Product for Workstation"
authors = [
    { name = "Jules (Agentic Software Engineer)", email = "jules@workstation.local" }
]
dependencies = [
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "rdflib>=7.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.0",
    "openpyxl>=3.1.0",
    "ollama>=0.1.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0"
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0"
]
