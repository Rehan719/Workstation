version: "17.0.0"
metadata:
  codename: "Omega-Recursion"
  status: "Production Beta"
  quantum_hardware: "Disabled (Classical Surrogate Enabled)"

truth_dimensions:
  - id: 1
    name: "Factual Accuracy"
    weight: 0.20
  - id: 2
    name: "Causal Integrity"
    weight: 0.15
  - id: 3
    name: "Source Provenance"
    weight: 0.15
  - id: 4
    name: "Neutrality & Bias"
    weight: 0.10
  - id: 5
    name: "Legal Precision"
    weight: 0.15
  - id: 6
    name: "Unit Economic Viability"
    weight: 0.05
  - id: 7
    name: "Scientific Falsifiability"
    weight: 0.10
  - id: 8
    name: "Ethical Alignment"
    weight: 0.05
  - id: 9
    name: "Computational Efficiency"
    weight: 0.03
  - id: 10
    name: "Recursion Safety"
    weight: 0.02

enforcement_modes:
  - stage: "SENSE"
    mode: "filter_and_tag"
  - stage: "ANALYSE"
    mode: "neural_verify"
  - stage: "ACT"
    mode: "sandbox_execution"
  - stage: "LEARN"
    mode: "policy_update"
  - stage: "RECIRCULATE"
    mode: "integrity_audit"

fractal_recirculation:
  micro:
    target_latency_ms: 100
    scope: "per-agent-safety"
  meso:
    target_latency_min: 15
    scope: "workflow-optimization"
  macro:
    target_latency_sec: 60
    scope: "strategic-evolution"

gaas_v4_config:
  intercept_all_actions: true
  min_confidence_score: 0.85
  circuit_breaker_threshold: 3
  reset_timeout_sec: 300
