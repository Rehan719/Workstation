self_healing:
  algorithm: "AEHO (Adaptive Evolutionary Homeostatic Optimization)"
  population_size: 50
  mutation_rate: 0.05
  crossover_rate: 0.8
  check_interval_sec: 60
  max_repair_attempts: 5

resilience:
  layers:
    - name: "BER (Base Excision Repair)"
      type: "state-consistency"
    - name: "MMR (Mismatch Repair)"
      type: "data-integrity"
    - name: "NER (Nucleotide Excision Repair)"
      type: "code-integrity"
    - name: "HDR (Homology-Directed Repair)"
      type: "functional-redundancy"

efficiency:
  target_resource_usage: 0.75
  power_management_mode: "performance"
