version: '3.8'
services:
  jules_organism:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./workstation_v17:/app/workstation_v17
      - /tmp/ueg_v17:/tmp/ueg_v17
  temporal:
    image: temporalio/auto-setup:1.20
  qdrant:
    image: qdrant/qdrant:latest
  ipfs:
    image: ipfs/kubo:latest
  grafana:
    image: grafana/grafana:latest
