# Workstation IDBO — production compose (W354: rewritten to match reality).
#
# The previous version was dead fiction: it referenced Dockerfile build stages that don't exist
# (`target: backend` / `target: frontend` — the Dockerfile is single-stage), a separate frontend
# service (the backend serves the built SPA itself), and env vars the app never reads (DATABASE_URL
# → an orphan config/database.py with zero importers; REDIS_URL, PQC_SECRET, NODE_ENV → nothing),
# plus monitoring services mounting an infra/prometheus.yml that isn't in the repo. It could not
# `docker compose build`.
#
# This is the honest, bootable single-service deployment. Running it on a paid host is the Owner's
# decision; the image itself builds and runs at no cost and depends on NO external AI provider
# (the native structured engine is the always-available floor).
services:
  backend:
    build:
      context: .            # the real single-stage Dockerfile (no `target:`)
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Only the vars the app genuinely reads:
      - DATA_DIR=/app/data
      - ENVIRONMENT=production
      - AI_ALLOW_EXTERNAL=false          # external providers are Owner-gated accelerants, off by default
      # Point at the Ollama sidecar below to use the owned local model (optional — omit to run
      # purely on the in-house native floor):
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_BASE_URL=http://ollama:11434
      # AUTH_ENABLED / SELF_SERVE_SIGNUP_ENABLED are Owner policy decisions — set them explicitly
      # here when the Owner turns multi-user on (default off = single-user).
    volumes:
      - workstation_data:/app/data       # persist the JSON stores + ledgers across redeploys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }
    # NOTE (honest): this image serves the JSON API. It also serves the built SPA when
    # apps/workstation-superapp/dist is present in the image; the default .dockerignore excludes
    # the frontend, so a UI-serving image must include that dist (build the frontend first and
    # adjust .dockerignore) — otherwise the deployment is API-only. See docs/DEPLOYMENT.md.

  # Optional owned-model sidecar. Comment this out to run on the native floor alone.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # The Owner pulls a model into the volume once, e.g.:
    #   docker compose exec ollama ollama pull llama3.2

volumes:
  workstation_data:
  ollama_models:
