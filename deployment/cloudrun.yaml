apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: workstation-api
  labels:
    app: workstation
    version: v-omega-infinity-master
spec:
  template:
    metadata:
      annotations:
        # Free-Tier Imperative: minScale must be 0 to avoid idle costs
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/${PROJECT_ID}/workstation-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: stripe-secret
              key: latest
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: stripe-webhook-secret
              key: latest
        - name: GOOGLE_CLOUD_PROJECT
          value: "${PROJECT_ID}"
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
