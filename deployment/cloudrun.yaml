apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: workstation-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containers:
      - image: gcr.io/${PROJECT_ID}/workstation-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: STRIPE_SECRET_KEY
          valueFrom: { secretKeyRef: { name: stripe-secret, key: key } }
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom: { secretKeyRef: { name: stripe-webhook-secret, key: key } }
        - name: GOOGLE_CLOUD_PROJECT
          value: "${PROJECT_ID}"
        resources:
          limits: { cpu: 1000m, memory: 512Mi }
          requests: { cpu: 100m, memory: 128Mi }
        livenessProbe:
          httpGet:
            path: /health
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
          initialDelaySeconds: 15
          periodSeconds: 10
