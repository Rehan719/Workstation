name: vΩ∞-MUSHĀWARA Sovereign Validation

on:
  push:
    branches: [ main, "feature/**", "phases/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install pydantic pyyaml numpy torch ruff mypy bandit cryptography POT scipy scikit-learn typing-extensions pyjwt shap

      - name: Zero-Placeholder Grep Gate
        run: python scripts/zero_placeholder_certification.py agentic_core/

      - name: Static Type Checking
        run: mypy --ignore-missing-imports agentic_core/

      - name: Security Audit (Bandit)
        run: bandit -r agentic_core/

      - name: Linting (Ruff)
        run: ruff check agentic_core/

      - name: OWASP ASI Security Audit
        run: python scripts/security_audit.py

      - name: Constitutional Rule Compilation
        run: |
          # Verify that legal precision minimiser can load rules
          export PYTHONPATH=.
          python3 -c "from agentic_core.governance.legal.legal_precision_minimiser import LegalPrecisionMinimiser; LegalPrecisionMinimiser()"
