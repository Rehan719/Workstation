name: Spine CI (backend suite + frontend build)

# Runs the REAL verification the legacy ci.yml never did: the live integration
# suite (integration_tests/test_mvp_spine.py) against a pip install of the tracked
# requirements.txt, plus the production frontend build (tsc + vite). Additive —
# does not replace the existing workflows.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend — boot + integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (pip / requirements.txt + test deps)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest          # dev/test-only dependency (not in the runtime requirements Render installs)
      - name: Boot check
        run: python -c "import agentic_core.app_mvp; print('boot ok')"
      - name: Integration suite (AI tests auto-skip without a key)
        run: python -m pytest integration_tests/test_mvp_spine.py --noconftest -q

  import-integrity:
    name: Import integrity — no dangling first-party imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Static only: no deps, no fixtures, a couple of seconds. It catches imports that no test
      # happens to exercise — the gap that let an archive pass move a live module out of the tree
      # while the whole suite stayed green.
      - name: Check import integrity
        run: python scripts/check_import_integrity.py

  browser-smoke:
    name: Browser smoke — the §3A routes actually render
    runs-on: ubuntu-latest
    # Runs in PARALLEL with the backend suite, so it adds no wall-clock to the pipeline while the
    # suite remains the long pole. Guards the class the response-shape tests cannot see: a page that
    # returns 200 with real bytes and still shows the user nothing (Round 11's Change Control page
    # rendered permanently empty over real data), fabricated markers reaching the screen, and hard
    # render crashes. Deliberately does NOT run AI generations — those take minutes on the owned
    # model and would make this slow and non-deterministic.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install workspace dependencies
        run: npm install
      - name: Build the frontend (the backend serves this dist)
        run: npm run build --workspace=apps/workstation-superapp
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start the backend (serves the built SPA)
        env:
          AI_DISABLE_LOCAL: '1'          # deterministic: the floor answers instantly, no model waits
          PYTHONIOENCODING: utf-8
        run: |
          python -m uvicorn agentic_core.app_mvp:app --port 8010 --log-level warning &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8010/api/v1/gaas/status && break
            sleep 2
          done
      - name: Seed one change request (so the data-vs-page assertion is not vacuous)
        run: |
          curl -sf -X POST http://localhost:8010/api/v1/cca/submit \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI smoke seed","description":"seeded so the page-vs-data check has data","change_type":"config_minor","submitted_by":"ci-smoke"}' \
            -o /dev/null || echo "seed failed — the smoke will still check the honest empty state"
      - name: Browser smoke
        run: node scripts/browser_smoke.mjs http://localhost:8010

  frontend:
    name: Frontend — typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install workspace dependencies
        run: npm install
      - name: Typecheck + build (tsc && vite build)
        run: npm run build --workspace=apps/workstation-superapp
