name: Genetic-Immune CI
on: [push, pull_request]
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zero-placeholder check
        run: grep -rE "(TODO|FIXME|pass|NotImplementedError|unittest\.mock)" --include="*.py" --include="*.tsx" agentic_core/ && exit 1 || echo "OK"
      - name: Sovereignty validation (no GCP SDK in core)
        run: ! grep -r "google.cloud" --include="*.py" agentic_core/ || (echo "❌ GCP SDK detected – sovereignty violated" && exit 1)
      - name: Install dependencies
        run: pip install ruff bandit pytest
      - name: Lint
        run: ruff check agentic_core/
      - name: Security audit
        run: bandit -r agentic_core/
      - name: Unit & integration tests
        run: pytest tests/
