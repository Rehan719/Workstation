nemo_sovereign:
  models:
    - name: "nemotron-3-super-120b"
      path: "/models/nemo/nemotron3-120b.nemo"
      quantization: "nvfp4"
      architecture: "Mamba-Attention-Hybrid"
      context_length: 1048576
    - name: "alphafold-3-microservice"
      path: "/services/alphafold3"
      accuracy_improvement: 0.50
  inference:
    tensor_parallelism: 8
    pipeline_parallelism: 2
    multi_token_prediction: enabled
  edge_hardware:
    gpu_memory_gb: 80
    cpu_cores: 64
    ram_gb: 256
