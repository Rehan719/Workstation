
<!DOCTYPE html>
<html>
<head>
    <title>LTSA v2: Stochastic Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #020617; color: #f8fafc; padding: 2rem; margin: 0; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .card { background: #0f172a; padding: 2rem; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1, h2 { color: #64ffda; text-transform: uppercase; letter-spacing: 2px; }
        .slider-group { margin-bottom: 2rem; }
        label { display: block; margin-bottom: 0.8rem; font-weight: bold; color: #94a3b8; }
        input[type="range"] { width: 100%; height: 6px; border-radius: 5px; background: #334155; accent-color: #64ffda; }
        .stats { display: flex; justify-content: space-between; margin-top: 1rem; border-top: 1px solid #334155; padding-top: 1rem; }
        .stat-box { text-align: center; }
        .stat-val { display: block; font-size: 1.8rem; font-weight: bold; color: #64ffda; }
        .stat-label { font-size: 0.8rem; color: #94a3b8; }
        .tornado-bar { height: 20px; background: #64ffda; margin-bottom: 5px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>LTSA v2: Stochastic Business Strategy Hub</h1>
    <div class="grid">
        <div class="card">
            <h2>Monte Carlo Revenue Projections (M)</h2>
            <canvas id="monteChart"></canvas>
            <div class="stats">
                <div class="stat-box"><span class="stat-val" id="valMean">$19.35</span><span class="stat-label">MEAN (5YR)</span></div>
                <div class="stat-box"><span class="stat-val" id="valP10">$15.48</span><span class="stat-label">P10 (CONSERVATIVE)</span></div>
                <div class="stat-box"><span class="stat-val" id="valP90">$23.22</span><span class="stat-label">P90 (OPTIMISTIC)</span></div>
            </div>
        </div>
        <div class="card">
            <h2>Control Parameters</h2>
            <div class="slider-group">
                <label>Market Adoption (Volatility: 20%)</label>
                <input type="range" id="paramAdoption" min="50" max="150" value="100" oninput="recalc()">
            </div>
            <div class="slider-group">
                <label>Pricing Module Index</label>
                <input type="range" id="paramPrice" min="50" max="150" value="100" oninput="recalc()">
            </div>
            <div class="slider-group">
                <label>Regulatory Urgency Factor</label>
                <input type="range" id="paramReg" min="80" max="120" value="100" oninput="recalc()">
            </div>

            <h2>Sensitivity Factors</h2>
            <div>
                <label>Adoption (45%)</label><div class="tornado-bar" style="width: 45%;"></div>
                <label>Price (35%)</label><div class="tornado-bar" style="width: 35%;"></div>
                <label>Market Growth (15%)</label><div class="tornado-bar" style="width: 15%;"></div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('monteChart').getContext('2d');
        const years = ['Y1', 'Y2', 'Y3', 'Y4', 'Y5'];
        const baseMeans = [0.6, 1.2, 3.5, 5.8, 8.25];

        let chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: years,
                datasets: [
                    { label: 'Mean Revenue', data: baseMeans, borderColor: '#64ffda', fill: false, tension: 0.3 },
                    { label: 'P90 (Optimistic)', data: baseMeans.map(v => v * 1.2), borderColor: '#4fd1c5', borderDash: [5,5], fill: false, tension: 0.3 },
                    { label: 'P10 (Conservative)', data: baseMeans.map(v => v * 0.8), borderColor: '#1e293b', borderDash: [5,5], fill: false, tension: 0.3 }
                ]
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: '#f8fafc' } } },
                scales: {
                    y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } }
                }
            }
        });

        function recalc() {
            const adopt = document.getElementById('paramAdoption').value / 100;
            const price = document.getElementById('paramPrice').value / 100;
            const reg = document.getElementById('paramReg').value / 100;

            const multiplier = adopt * price * reg;
            const newMean = baseMeans.map(v => (v * multiplier).toFixed(2));
            const newP90 = newMean.map(v => (v * 1.2).toFixed(2));
            const newP10 = newMean.map(v => (v * 0.8).toFixed(2));

            chart.data.datasets[0].data = newMean;
            chart.data.datasets[1].data = newP90;
            chart.data.datasets[2].data = newP10;
            chart.update();

            const sum = newMean.reduce((a, b) => parseFloat(a) + parseFloat(b), 0).toFixed(2);
            document.getElementById('valMean').innerText = '$' + sum;
            document.getElementById('valP90').innerText = '$' + (sum * 1.2).toFixed(2);
            document.getElementById('valP10').innerText = '$' + (sum * 0.8).toFixed(2);
        }
    </script>
</body>
</html>
