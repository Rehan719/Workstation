services:
  - type: web
    name: workstation-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agentic_core.app_mvp:app --host 0.0.0.0 --port $PORT
    envVars:
      # AI posture: IN-HOUSE-FIRST. The backend runs on its OWN native fabric and boots + fully
      # serves with NO external key (the native structured engine is the always-available floor;
      # a self-hosted Ollama model is used when present). ANTHROPIC/OPENAI are OPTIONAL accelerants,
      # used only when AI_ALLOW_EXTERNAL=true AND a key is configured — never a dependency.
      - key: AI_ALLOW_EXTERNAL
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false          # optional — external accelerant, only if AI_ALLOW_EXTERNAL=true
      - key: OPENAI_API_KEY
        sync: false          # optional — multimodal (voice/vision) + external accelerant
      - key: OLLAMA_URL
        sync: false          # optional — self-hosted local model URL; absent → native floor
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false          # Set to your frontend URL(s) e.g. https://workstation.vercel.app
      - key: AUTH_ENABLED
        value: "false"       # Set to "true" to require JWT auth
      - key: JWT_SECRET
        sync: false          # Auto-generated if not set; set explicitly for key rotation
      - key: ADMIN_PASSWORD
        sync: false          # Override default before going live
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: GATEWAY_RPM
        value: "20"
      - key: GATEWAY_MAX_TOKENS
        value: "4096"
      - key: MODEL_BACKEND
        value: anthropic
      - key: LOG_LEVEL
        value: INFO
      - key: DATA_DIR
        value: data
    healthCheckPath: /health
    autoDeploy: true
