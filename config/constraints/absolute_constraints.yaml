self_reflection_mandate:
  description: "System must run a digital twin that continuously simulates and critiques its own behaviour."
  enforcement: "CI checks for twin sync errors; fail if twin fails to run for >5 minutes."
  action_on_violation: "trigger_self_repair_audit"
  articles_referenced: [12, 45, 102]

transparent_self_modification:
  description: "All self-generated patches must be logged to UEG and approved by Regulator before live deployment."
  enforcement: "Reconfigulator must not apply patches without UEG signature and MultiSigCouncil vote (simulated)."
  action_on_violation: "reject_patch_escalate"
  required_logs: ["GENETIC_MUTATION_PROPOSAL", "REGULATOR_DECISION", "UEG_MERKLE_PROOF"]

predictive_integrity:
  description: "Twin simulations must maintain ≥85% confidence on 1-hour horizon."
  enforcement: "Validation suite fails if prediction confidence < 0.85 for 3 consecutive cycles."
  action_on_violation: "degrade_to_rule_based_fallback"
  fallback_mode: "constitutional_rule_engine_v3"
